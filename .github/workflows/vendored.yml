name: Vendored

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison \
            build-essential \
            flex \
            libgnutls28-dev \
            libparse-yapp-perl \
            libssl-dev \
            libunistring-dev \
            make \
            pkg-config \
            python3 \
            zlib1g-dev
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
          bison \
          cpanminus \
          flex \
          gettext \
          gmp \
          gnutls \
          libunistring \
          openssl \
          pkg-config \
          zlib
          brew link --force bison
          brew link --force flex
          brew link --force gettext
          brew link --force gmp
          brew link --force gnutls
          brew link --force libunistring
          brew link --force openssl
          brew link --force zlib
          cpanm Parse::Yapp::Driver
      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vendored-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Build
        run: just vendored
